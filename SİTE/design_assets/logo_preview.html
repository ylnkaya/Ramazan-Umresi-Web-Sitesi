<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin:0; padding:0; }</style>
</head>
<body class="bg-white overflow-hidden" style="width:900px;height:560px;">

  <!-- Header label -->
  <div style="text-align:center;padding:22px 0 10px;font-family:Georgia,serif;font-size:10px;letter-spacing:0.4em;color:#aaa;">RAMAZAN UMRESİ — LOGO SİSTEMİ</div>

  <!-- TOP: Horizontal logo -->
  <div style="display:flex;justify-content:center;align-items:center;padding:10px 0 8px;">
    <!-- Mini label -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:0;">
      <div style="font-family:Georgia,serif;font-size:8px;letter-spacing:0.35em;color:#bbb;margin-bottom:14px;">YATAY VERSİYON</div>
      <div style="display:flex;align-items:center;padding:0 40px;gap:0;background:white;border:1px solid #f0ede6;width:700px;height:172px;">
        <!-- SYMBOL -->
        <div style="flex-shrink:0;">
          <svg width="112" height="112" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
            <circle cx="64" cy="64" r="60" fill="none" stroke="#C9A860" stroke-width="0.7" opacity="0.55"/>
            <circle cx="64" cy="64" r="55" fill="none" stroke="#C9A860" stroke-width="0.3" opacity="0.2"/>
            <defs>
              <mask id="cm-ph">
                <rect width="128" height="128" fill="white"/>
                <circle cx="77" cy="55" r="41" fill="black"/>
              </mask>
            </defs>
            <circle cx="60" cy="67" r="45" fill="#C9A860" mask="url(#cm-ph)"/>
            <g transform="translate(99, 36)">
              <rect x="-6.5" y="-6.5" width="13" height="13" fill="#1A2744"/>
              <rect x="-6.5" y="-6.5" width="13" height="13" fill="#1A2744" transform="rotate(45)"/>
              <circle r="2" fill="#C9A860"/>
            </g>
            <line x1="32" y1="108" x2="96" y2="108" stroke="#C9A860" stroke-width="0.6" opacity="0.35"/>
          </svg>
        </div>
        <!-- DIVIDER -->
        <div style="flex-shrink:0;display:flex;align-items:center;align-self:stretch;padding:34px 0;margin:0 32px;">
          <div style="width:1px;height:100%;background:linear-gradient(to bottom,transparent,#C9A860 25%,#C9A860 75%,transparent);opacity:0.45;"></div>
        </div>
        <!-- WORDMARK -->
        <div style="flex:1;">
          <div style="font-family:Georgia,'Times New Roman',serif;font-size:27px;letter-spacing:0.24em;color:#1A2744;font-weight:400;white-space:nowrap;line-height:1;">RAMAZAN UMRESİ</div>
          <div style="margin:10px 0 8px;display:flex;align-items:center;gap:10px;">
            <div style="width:22px;height:1px;background:#C9A860;opacity:0.9;"></div>
            <div style="flex:1;max-width:300px;height:1px;background:linear-gradient(to right,#C9A860,rgba(201,168,96,0.15));opacity:0.85;"></div>
          </div>
          <div style="font-family:Georgia,'Times New Roman',serif;font-size:9.5px;letter-spacing:0.42em;color:#C9A860;font-weight:400;white-space:nowrap;">KUTSAL TOPRAKLARA YOLCULUK</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Thin separator -->
  <div style="display:flex;justify-content:center;margin:10px 0;"><div style="width:200px;height:1px;background:#eee;"></div></div>

  <!-- BOTTOM: Vertical logo -->
  <div style="display:flex;justify-content:center;align-items:flex-start;padding:4px 0;">
    <div style="display:flex;flex-direction:column;align-items:center;">
      <div style="font-family:Georgia,serif;font-size:8px;letter-spacing:0.35em;color:#bbb;margin-bottom:10px;">DİKEY VERSİYON</div>
      <div style="background:white;border:1px solid #f0ede6;width:240px;height:246px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;">
        <!-- SYMBOL -->
        <svg width="110" height="110" viewBox="0 0 148 148" xmlns="http://www.w3.org/2000/svg">
          <circle cx="74" cy="74" r="70" fill="none" stroke="#C9A860" stroke-width="0.8" opacity="0.55"/>
          <circle cx="74" cy="74" r="64" fill="none" stroke="#C9A860" stroke-width="0.3" opacity="0.2"/>
          <defs>
            <mask id="cm-pv">
              <rect width="148" height="148" fill="white"/>
              <circle cx="89" cy="63" r="47" fill="black"/>
            </mask>
          </defs>
          <circle cx="70" cy="76" r="52" fill="#C9A860" mask="url(#cm-pv)"/>
          <g transform="translate(114, 43)">
            <rect x="-7.5" y="-7.5" width="15" height="15" fill="#1A2744"/>
            <rect x="-7.5" y="-7.5" width="15" height="15" fill="#1A2744" transform="rotate(45)"/>
            <circle r="2.5" fill="#C9A860"/>
          </g>
          <line x1="36" y1="125" x2="112" y2="125" stroke="#C9A860" stroke-width="0.6" opacity="0.35"/>
        </svg>
        <!-- WORDMARK -->
        <div style="text-align:center;margin-top:10px;">
          <div style="font-family:Georgia,'Times New Roman',serif;font-size:18px;letter-spacing:0.3em;color:#1A2744;font-weight:400;line-height:1;">RAMAZAN</div>
          <div style="font-family:Georgia,'Times New Roman',serif;font-size:14px;letter-spacing:0.45em;color:#1A2744;font-weight:400;line-height:1;margin-top:4px;">UMRESİ</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin:10px auto;">
            <div style="width:16px;height:1px;background:#C9A860;opacity:0.8;"></div>
            <div style="width:4px;height:4px;background:#C9A860;transform:rotate(45deg);opacity:0.85;"></div>
            <div style="width:16px;height:1px;background:#C9A860;opacity:0.8;"></div>
          </div>
          <div style="font-family:Georgia,'Times New Roman',serif;font-size:7px;letter-spacing:0.35em;color:#C9A860;white-space:nowrap;">KUTSAL TOPRAKLARA YOLCULUK</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
